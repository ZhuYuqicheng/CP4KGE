[project]
name = "kgcp"
version = "0.1.0"
description = "Conformal prediction for knowledge graph embeddings."
readme = "README.md"
authors = [{ name = "Yuqicheng Zhu" }]
requires-python = ">=3.10"
dependencies = ["libkge", "torch>=2.0", "unkge"]

[project.urls]
Repository = "https://github.com/ZhuYuqicheng/CP4KGE"
Models = "https://huggingface.co/Yuqicheng/KGCP-KGE-Checkpoints"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "optuna>=5.0.0",
    "pytest",
    "scipy>=1.15.3",
    "tqdm>=4.70.1",
]
modal = [
    "modal>=1.6.1",
]

[tool.uv.sources]
libkge = { path = "third_party/libkge", editable = true }
unkge = { path = "third_party/unkge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
