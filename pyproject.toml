[project]
name = "kge-conformal"
version = "0.1.0"
description = "Conformal prediction for knowledge graph embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["libkge", "torch>=2.0"]

[dependency-groups]
dev = [
    "optuna>=5.0.0",
    "pytest",
    "scipy>=1.15.3",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
libkge = { path = "third_party/libkge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
