[project]
name = "kgcp"
version = "0.1.0"
description = "Conformal prediction for knowledge graph embeddings."
readme = "README.md"
authors = [{ name = "Yuqicheng Zhu" }]
requires-python = ">=3.10"
# kgcp itself needs only PyTorch: it calibrates the logits (or confidences) of any model.
# The backends that load models are optional, see [dependency-groups].
dependencies = ["torch>=2.0"]
keywords = [
    "knowledge graph embedding",
    "conformal prediction",
    "uncertainty quantification",
    "link prediction",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ZhuYuqicheng/CP4KGE"
Models = "https://huggingface.co/Yuqicheng/KGCP-KGE-Checkpoints"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "optuna>=5.0.0",
    "pytest",
    "scipy>=1.15.3",
    "tqdm>=4.70.1",
]
# The LibKGE backend (kgcp.LibKGE) and the models of uncertain knowledge graphs: the
# packages in third_party/. They are not on PyPI, so they are a dependency group of this
# repository, not an extra of the published package (which could not name them).
libkge = ["libkge", "unkge"]
modal = [
    "modal>=1.6.1",
]

[tool.uv]
default-groups = ["dev", "libkge"]  # what `uv sync` installs in a clone

[tool.uv.sources]
libkge = { path = "third_party/libkge", editable = true }
unkge = { path = "third_party/unkge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgcp"]

# Without this list, the source distribution would hold every file of the repository that
# .gitignore does not name: results, notebooks, third_party/, local drafts.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
