[project]
name = "unkge"
version = "0.1.0"
description = "LibKGE models for uncertain knowledge graphs (UKGE, BEUrRE), to load the models of UnKGCP."
requires-python = ">=3.10"
dependencies = ["libkge", "torch>=2.0"]

[tool.uv.sources]
libkge = { path = "../libkge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unkge"]
