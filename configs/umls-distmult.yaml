# distmult on umls, tuned with scripts/tune.py (see docs/hyperparameter_tuning.md).
#   kge start configs/umls-distmult.yaml --random_seed.default 1
job.type: train
job.auto_correct: true
dataset.name: umls
import:
- distmult
- reciprocal_relations_model
reciprocal_relations_model.base_model.type: distmult
train.max_epochs: 400
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.threshold: 0.0001
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.0406
entity_ranking.filter_with_test: false
eval.batch_size: 256
model: reciprocal_relations_model
train.type: KvsAll
train.loss: kl
train.batch_size: 512
train.optimizer.default.type: Adam
train.optimizer.default.args.lr: 0.07454705355213768
train.lr_scheduler_args.patience: 0
lookup_embedder.dim: 128
lookup_embedder.initialize: normal_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.0009831065887826499
lookup_embedder.initialize_args.uniform_.a: -0.4642629059876967
lookup_embedder.initialize_args.uniform_.b: 0.4642629059876967
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 2
lookup_embedder.regularize_args.weighted: true
distmult.entity_embedder.regularize_weight: 1.8491417339766303e-10
distmult.relation_embedder.regularize_weight: 1.9641676406384483e-09
distmult.entity_embedder.dropout: 0.0
distmult.relation_embedder.dropout: 0.48477222211658955
KvsAll.label_smoothing: 0.0
