# ConvE on FB15k-237: final configuration of LibKGE's authors, from their ICLR 2020 study.
#   published: https://web.informatik.uni-mannheim.de/pi1/iclr2020-models/fb15k-237-conve.yaml
#   model:     models/libkge/fb15k-237-conve.pt (LibKGE 4b2414a, PyTorch 1.3.0;
#              epoch 390, validation MRR 0.3436 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: 1vsAll, cross-entropy (kl). Reported test: MRR 0.339, Hits@1 0.248, Hits@3 0.369, Hits@10 0.521.
#   kge start configs/libkge/fb15k-237-conve.yaml
dataset.name: fb15k-237
import:
- conve
- reciprocal_relations_model
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.entity_embedder.dim: 288
reciprocal_relations_model.base_model.relation_embedder.dim: 288
train.batch_size: 1024
train.loss: kl
train.loss_arg: 1.0
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 9
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.004276645525573683
train.optimizer.default.type: Adagrad
train.type: 1vsAll
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
eval.trace_level: example
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 256
lookup_embedder.initialize: xavier_normal_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 2.568825067721716e-05
lookup_embedder.initialize_args.uniform_.a: -0.43447215763614
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 3
lookup_embedder.regularize_args.weighted: true
conve.entity_embedder.dropout: -0.4457199978380867
conve.entity_embedder.regularize_weight: 8.605027799155396e-15
conve.feature_map_dropout: 0.48769345636955713
conve.projection_dropout: 0.5
conve.relation_embedder.dropout: 0.11757230155305998
conve.relation_embedder.regularize_weight: 2.231687936571624e-14
conve.round_dim: true
negative_sampling.implementation: batch
negative_sampling.num_samples.p: -1
