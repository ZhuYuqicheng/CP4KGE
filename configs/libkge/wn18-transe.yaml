# TransE on WN18: final configuration of LibKGE's authors, from their later LibKGE runs (2020).
#   published: https://web.informatik.uni-mannheim.de/pi1/libkge-models/wn18-transe.yaml
#   model:     models/libkge/wn18-transe.pt (LibKGE commit not recorded, PyTorch 1.4.0;
#              epoch 385, validation MRR 0.5679 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: negative sampling, binary cross-entropy (bce). Reported test: MRR 0.553, Hits@1 0.315, Hits@3 0.764, Hits@10 0.924.
# Uniform initialization draws from [a, 1]: b = 1, PyTorch's default, is added here explicitly.
#   kge start configs/libkge/wn18-transe.yaml
dataset.name: wn18
import:
- reciprocal_relations_model
- transe
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.type: transe
train.batch_size: 256
train.loss: bce
train.loss_arg: 14.250112183
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 9
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.0027175088993333166
train.optimizer.default.type: Adam
train.type: negative_sampling
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 128
lookup_embedder.initialize: uniform_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.10729855034497567
lookup_embedder.initialize_args.uniform_.a: -0.38962866740215174
lookup_embedder.initialize_args.uniform_.b: 1.0
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: ''
lookup_embedder.regularize_args.p: 2
lookup_embedder.regularize_args.weighted: false
transe.entity_embedder.dropout: -0.422975653353568
transe.entity_embedder.normalize.p: -1.0
transe.entity_embedder.regularize_weight: 1.6636151211900268e-20
transe.l_norm: 2.0
transe.relation_embedder.dropout: -0.11585208066935981
transe.relation_embedder.normalize.p: -1.0
transe.relation_embedder.regularize_weight: 0.00020809861953333656
negative_sampling.implementation: triple
negative_sampling.num_samples.o: 2
negative_sampling.num_samples.p: 0
negative_sampling.num_samples.s: 1000
