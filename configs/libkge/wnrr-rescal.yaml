# RESCAL on WN18RR: final configuration of LibKGE's authors, from their ICLR 2020 study.
#   published: https://web.informatik.uni-mannheim.de/pi1/iclr2020-models/wnrr-rescal.yaml
#   model:     models/libkge/wnrr-rescal.pt (LibKGE 4b2414a, PyTorch 1.3.0;
#              epoch 400, validation MRR 0.4703 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: KvsAll, cross-entropy (kl). Reported test: MRR 0.467, Hits@1 0.439, Hits@3 0.480, Hits@10 0.517.
# Uniform initialization draws from [a, 1]: b = 1, PyTorch's default, is added here explicitly.
#   kge start configs/libkge/wnrr-rescal.yaml
dataset.name: wnrr
import:
- reciprocal_relations_model
- rescal
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.relation_embedder.dim: 16384
reciprocal_relations_model.base_model.type: rescal
train.batch_size: 128
train.loss: kl
train.loss_arg: 1.0
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 8
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.0008535391032574453
train.optimizer.default.type: Adam
train.type: KvsAll
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
eval.trace_level: example
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 128
lookup_embedder.initialize: uniform_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.040050258996206144
lookup_embedder.initialize_args.uniform_.a: -0.4063789847256075
lookup_embedder.initialize_args.uniform_.b: 1.0
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 3
lookup_embedder.regularize_args.weighted: false
rescal.entity_embedder.dropout: -0.29821809173392233
rescal.entity_embedder.regularize_weight: 2.7316949258356523e-14
rescal.relation_embedder.dropout: 0.23784801073601625
rescal.relation_embedder.regularize_weight: 5.1397914949342275e-15
KvsAll.label_smoothing: 0.3
negative_sampling.implementation: batch
negative_sampling.num_samples.p: -1
