# DistMult on WN18: final configuration of LibKGE's authors, from their later LibKGE runs (2020).
#   published: https://web.informatik.uni-mannheim.de/pi1/libkge-models/wn18-distmult.yaml
#   model:     models/libkge/wn18-distmult.pt (LibKGE commit not recorded, PyTorch 1.4.0;
#              epoch 105, validation MRR 0.9404 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: 1vsAll, cross-entropy (kl). Reported test: MRR 0.941, Hits@1 0.932, Hits@3 0.948, Hits@10 0.954.
# Training penalized twice as strongly as today's LibKGE does with these weights: double
# both regularize_weight values to reproduce it (models/libkge/README.md).
#   kge start configs/libkge/wn18-distmult.yaml
dataset.name: wn18
import:
- distmult
- reciprocal_relations_model
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.type: distmult
train.batch_size: 128
train.loss: kl
train.loss_arg: .nan
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 6
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.01491283384545359
train.optimizer.default.type: Adagrad
train.type: 1vsAll
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 512
lookup_embedder.initialize: normal_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.00037098133561850986
lookup_embedder.initialize_args.uniform_.a: -0.3466218517887806
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 3
lookup_embedder.regularize_args.weighted: false
distmult.entity_embedder.dropout: -0.47765377159982886
distmult.entity_embedder.regularize_weight: 7.95620960423552e-16
distmult.relation_embedder.dropout: 0.04761411718936126
distmult.relation_embedder.regularize_weight: 7.377492941887899e-19
negative_sampling.implementation: batch
