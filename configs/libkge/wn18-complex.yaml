# ComplEx on WN18: final configuration of LibKGE's authors, from their later LibKGE runs (2020).
#   published: https://web.informatik.uni-mannheim.de/pi1/libkge-models/wn18-complex.yaml
#   model:     models/libkge/wn18-complex.pt (LibKGE commit not recorded, PyTorch 1.4.0;
#              epoch 170, validation MRR 0.9499 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: KvsAll, cross-entropy (kl). Reported test: MRR 0.951, Hits@1 0.947, Hits@3 0.953, Hits@10 0.958.
# Uniform initialization draws from [a, 1]: b = 1, PyTorch's default, is added here explicitly.
#   kge start configs/libkge/wn18-complex.yaml
dataset.name: wn18
import:
- complex
- reciprocal_relations_model
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.type: complex
train.batch_size: 1024
train.loss: kl
train.loss_arg: .nan
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 3
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.09451761031798325
train.optimizer.default.type: Adagrad
train.type: KvsAll
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 512
lookup_embedder.initialize: uniform_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.005097360318207646
lookup_embedder.initialize_args.uniform_.a: -0.7833878951504487
lookup_embedder.initialize_args.uniform_.b: 1.0
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 3
lookup_embedder.regularize_args.weighted: true
complex.entity_embedder.dropout: 0.08641306425712092
complex.entity_embedder.regularize_weight: 0.017035615377444645
complex.relation_embedder.dropout: -0.355276912359341
complex.relation_embedder.regularize_weight: 3.7202864907483997e-08
KvsAll.label_smoothing: 0.016310582872175905
negative_sampling.implementation: batch
