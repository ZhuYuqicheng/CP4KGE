# TransE on FB15k: final configuration of LibKGE's authors, from their later LibKGE runs (2020).
#   published: https://web.informatik.uni-mannheim.de/pi1/libkge-models/fb15k-transe.yaml
#   model:     models/libkge/fb15k-transe.pt (LibKGE c683e89, PyTorch 1.6.0;
#              epoch 395, validation MRR 0.6833 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: negative sampling, binary cross-entropy (bce). Reported test: MRR 0.676, Hits@1 0.542, Hits@3 0.787, Hits@10 0.875.
#   kge start configs/libkge/fb15k-transe.yaml
dataset.name: fb15k
import:
- transe
- reciprocal_relations_model
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.type: transe
train.batch_size: 256
train.loss: bce
train.loss_arg: 17.540344176544743
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 5
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.03905029418908963
train.optimizer.default.type: Adagrad
train.type: negative_sampling
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 512
lookup_embedder.initialize: normal_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.00046641918462790577
lookup_embedder.initialize_args.uniform_.a: -0.49293330636486765
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 1
lookup_embedder.regularize_args.weighted: true
transe.entity_embedder.dropout: 0.02436051487143487
transe.entity_embedder.normalize.p: 2.0
transe.entity_embedder.regularize_weight: 9.595942924544555e-11
transe.relation_embedder.dropout: -0.08154134635692545
transe.relation_embedder.normalize.p: 2.0
transe.relation_embedder.regularize_weight: 9.529759313329966e-18
negative_sampling.implementation: triple
negative_sampling.num_samples.o: 35
negative_sampling.num_samples.p: 0
negative_sampling.num_samples.s: 12
