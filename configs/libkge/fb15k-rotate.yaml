# RotatE on FB15k: final configuration of LibKGE's authors, from their later LibKGE runs (2020).
#   published: https://web.informatik.uni-mannheim.de/pi1/libkge-models/fb15k-rotate.yaml
#   model:     models/libkge/fb15k-rotate.pt (LibKGE commit not recorded, PyTorch 1.6.0;
#              epoch 400, validation MRR 0.7840 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: negative sampling, cross-entropy (kl). Reported test: MRR 0.783, Hits@1 0.727, Hits@3 0.820, Hits@10 0.877.
#   kge start configs/libkge/fb15k-rotate.yaml
dataset.name: fb15k
import:
- reciprocal_relations_model
- rotate
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.relation_embedder.dim: 128
reciprocal_relations_model.base_model.type: rotate
train.batch_size: 512
train.loss: kl
train.loss_arg: .nan
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 4
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.38030867647803834
train.optimizer.default.type: Adagrad
train.subbatch_auto_tune: true
train.type: negative_sampling
entity_ranking.chunk_size: 5000
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 256
lookup_embedder.initialize: normal_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.0495149496143047
lookup_embedder.initialize_args.uniform_.a: -0.8978815014779652
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 3
lookup_embedder.regularize_args.weighted: false
rotate.entity_embedder.dropout: -0.21862865970440937
rotate.entity_embedder.regularize_weight: 4.56985776657145e-09
rotate.l_norm: 2.0
rotate.relation_embedder.dropout: -0.3645267730568348
rotate.relation_embedder.regularize_weight: 1.526902234139287e-15
negative_sampling.implementation: triple
negative_sampling.num_samples.o: 349
negative_sampling.num_samples.p: 0
negative_sampling.num_samples.s: 46
