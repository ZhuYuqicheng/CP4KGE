# ComplEx on FB15k: final configuration of LibKGE's authors, from their later LibKGE runs (2020).
#   published: https://web.informatik.uni-mannheim.de/pi1/libkge-models/fb15k-complex.yaml
#   model:     models/libkge/fb15k-complex.pt (LibKGE commit not recorded, PyTorch 1.4.0;
#              epoch 55, validation MRR 0.8349 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: 1vsAll, cross-entropy (kl). Reported test: MRR 0.838, Hits@1 0.807, Hits@3 0.856, Hits@10 0.893.
#   kge start configs/libkge/fb15k-complex.yaml
dataset.name: fb15k
import:
- reciprocal_relations_model
- complex
job.auto_correct: true
model: complex
reciprocal_relations_model.base_model.type: complex
train.batch_size: 256
train.loss: kl
train.loss_arg: .nan
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 8
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.06948911266889275
train.optimizer.default.type: Adagrad
train.type: 1vsAll
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 256
lookup_embedder.initialize: xavier_uniform_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.0028310175592036607
lookup_embedder.initialize_args.uniform_.a: -0.8659906377354264
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 2
lookup_embedder.regularize_args.weighted: false
complex.entity_embedder.dropout: -0.06161046028137207
complex.entity_embedder.regularize_weight: 9.556005825065507e-07
complex.relation_embedder.dropout: -0.03550025820732117
complex.relation_embedder.regularize_weight: 2.5609772540228596e-17
negative_sampling.implementation: batch
