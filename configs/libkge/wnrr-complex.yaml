# ComplEx on WN18RR: final configuration of LibKGE's authors, from their ICLR 2020 study.
#   published: https://web.informatik.uni-mannheim.de/pi1/iclr2020-models/wnrr-complex.yaml
#   model:     models/libkge/wnrr-complex.pt (LibKGE 4b2414a, PyTorch 1.3.0;
#              epoch 285, validation MRR 0.4770 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: 1vsAll, cross-entropy (kl). Reported test: MRR 0.475, Hits@1 0.438, Hits@3 0.490, Hits@10 0.547.
# Uniform initialization draws from [a, 1]: b = 1, PyTorch's default, is added here explicitly.
#   kge start configs/libkge/wnrr-complex.yaml
dataset.name: wnrr
import:
- complex
- reciprocal_relations_model
job.auto_correct: true
model: complex
reciprocal_relations_model.base_model.type: complex
train.batch_size: 512
train.loss: kl
train.loss_arg: 1.0
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 5
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.5255808623927111
train.optimizer.default.type: Adagrad
train.type: 1vsAll
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
eval.trace_level: example
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 128
lookup_embedder.initialize: uniform_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.0005472140383629246
lookup_embedder.initialize_args.uniform_.a: -0.28148249060722197
lookup_embedder.initialize_args.uniform_.b: 1.0
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 2
lookup_embedder.regularize_args.weighted: false
complex.entity_embedder.dropout: 0.3592749142853321
complex.entity_embedder.regularize_weight: 4.5230047706178325e-06
complex.relation_embedder.dropout: 0.3112283826796357
complex.relation_embedder.regularize_weight: 4.192985917075565e-10
negative_sampling.implementation: batch
negative_sampling.num_samples.p: -1
