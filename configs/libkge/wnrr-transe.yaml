# TransE on WN18RR: final configuration of LibKGE's authors, from their ICLR 2020 study.
#   published: https://web.informatik.uni-mannheim.de/pi1/iclr2020-models/wnrr-transe.yaml
#   model:     models/libkge/wnrr-transe.pt (LibKGE 4b2414a, PyTorch 1.3.0;
#              epoch 350, validation MRR 0.2265 filtered with test)
# Values equal the configuration stored in that model (see models/libkge/README.md).
# Training: negative sampling, cross-entropy (kl). Reported test: MRR 0.228, Hits@1 0.053, Hits@3 0.368, Hits@10 0.520.
#   kge start configs/libkge/wnrr-transe.yaml
dataset.name: wnrr
import:
- transe
- reciprocal_relations_model
job.auto_correct: true
model: reciprocal_relations_model
reciprocal_relations_model.base_model.type: transe
train.batch_size: 128
train.loss: kl
train.loss_arg: 1.0
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.patience: 5
train.lr_scheduler_args.threshold: 0.0001
train.max_epochs: 400
train.optimizer.default.args.lr: 0.2532720169185861
train.optimizer.default.type: Adagrad
train.type: negative_sampling
entity_ranking.filter_with_test: true
entity_ranking.metrics_per.relation_type: true
eval.batch_size: 256
eval.trace_level: example
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.05
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered_with_test
lookup_embedder.dim: 512
lookup_embedder.initialize: xavier_normal_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.00036174939032954854
lookup_embedder.initialize_args.uniform_.a: -0.393658811201549
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 2
lookup_embedder.regularize_args.weighted: false
transe.entity_embedder.dropout: 0.2519204934424376
transe.entity_embedder.normalize.p: -1.0
transe.entity_embedder.regularize_weight: 2.1299293567133326e-07
transe.l_norm: 2.0
transe.relation_embedder.dropout: -0.025948206777731686
transe.relation_embedder.normalize.p: -1.0
transe.relation_embedder.regularize_weight: 8.992034045083661e-13
negative_sampling.implementation: triple
negative_sampling.num_samples.o: 158
negative_sampling.num_samples.p: -1
negative_sampling.num_samples.s: 70
