# complex on nations, tuned with scripts/tune.py (see docs/hyperparameter_tuning.md).
#   kge start configs/nations-complex.yaml --random_seed.default 1
job.type: train
job.auto_correct: true
dataset.name: nations
import:
- complex
- reciprocal_relations_model
reciprocal_relations_model.base_model.type: complex
train.max_epochs: 400
train.lr_scheduler: ReduceLROnPlateau
train.lr_scheduler_args.mode: max
train.lr_scheduler_args.factor: 0.95
train.lr_scheduler_args.threshold: 0.0001
valid.every: 5
valid.metric: mean_reciprocal_rank_filtered
valid.early_stopping.patience: 10
valid.early_stopping.threshold.epochs: 50
valid.early_stopping.threshold.metric_value: 0.2323
entity_ranking.filter_with_test: false
eval.batch_size: 256
model: reciprocal_relations_model
train.type: negative_sampling
train.loss: bce
train.batch_size: 64
train.optimizer.default.type: Adagrad
train.optimizer.default.args.lr: 0.22897644979648926
train.lr_scheduler_args.patience: 1
lookup_embedder.dim: 512
lookup_embedder.initialize: uniform_
lookup_embedder.initialize_args.normal_.mean: 0.0
lookup_embedder.initialize_args.normal_.std: 0.03742239792868467
lookup_embedder.initialize_args.uniform_.a: -0.2888601635417063
lookup_embedder.initialize_args.uniform_.b: 0.2888601635417063
lookup_embedder.initialize_args.xavier_normal_.gain: 1.0
lookup_embedder.initialize_args.xavier_uniform_.gain: 1.0
lookup_embedder.regularize: lp
lookup_embedder.regularize_args.p: 3
lookup_embedder.regularize_args.weighted: true
complex.entity_embedder.regularize_weight: 0.001102515946391823
complex.relation_embedder.regularize_weight: 4.196911780056592e-12
complex.entity_embedder.dropout: 0.0
complex.relation_embedder.dropout: 0.0
negative_sampling.num_samples.s: 1
negative_sampling.num_samples.o: 6
